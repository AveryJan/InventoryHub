<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InventoryHub | Stock Management</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="header"><div><span class="eyebrow">INVENTORY OPERATIONS</span><h1>InventoryHub</h1><p>Track stock, update products, and keep every item accounted for.</p></div><span class="pill">Live API</span></header>
    <section class="stats" aria-label="Inventory summary">
      <div class="stat"><span>Matching items</span><strong id="total">—</strong></div>
      <div class="stat"><span>Visible items</span><strong id="visible">—</strong></div>
      <div class="stat"><span>Page</span><strong id="page-number">—</strong></div>
    </section>
    <div class="layout">
      <section class="panel">
        <div class="panel-heading"><h2>Products</h2><input id="search" type="search" placeholder="Search name or SKU" aria-label="Search products"></div>
        <p id="notice" role="status" aria-live="polite"></p>
        <div class="table-scroll"><table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Qty</th><th>Price</th><th>Actions</th></tr></thead><tbody id="items"></tbody></table></div>
        <div class="pager"><button type="button" id="prev">Previous</button><span id="pagination"></span><button type="button" id="next">Next</button></div>
      </section>
      <section class="panel form-panel">
        <h2 id="form-title">Add item</h2>
        <form id="product-form">
          <label>SKU<input name="sku" maxlength="120" required placeholder="SKU-1001"></label>
          <label>Name<input name="name" maxlength="120" required placeholder="Wireless mouse"></label>
          <label>Category<input name="category" maxlength="120" placeholder="Accessories"></label>
          <div class="two-col"><label>Quantity<input name="quantity" type="number" min="0" step="1" required value="0"></label><label>Price ($)<input name="price" type="number" min="0" step="0.01" required value="0.00"></label></div>
          <button class="primary" type="submit" id="save">Save item</button><button type="button" id="cancel" hidden>Cancel edit</button>
        </form>
      </section>
    </div>
    <footer>InventoryHub • Flask + SQLite + vanilla JavaScript</footer>
  </main>
</body>
</html>
